# Локальные PostgreSQL + PostGIS и Redis — те же образы и учётные данные,
# что в CI (.github/workflows/ci.yml) и в README («Локальный запуск»).
# Замена двум `docker run` из README: имена контейнеров те же (rg-pg,
# rg-redis), поэтому остальные команды README работают без правок.
#
#   docker compose up -d --wait   # поднять и дождаться готовности
#   docker compose down           # остановить; данные базы сохраняются
#   docker compose down -v        # остановить и стереть данные базы
#
# Схему контейнер сам не разворачивает: снимок production_schema.sql и
# миграции поверх него применяются командами из README, как в CI.

name: nirivio-local

services:
  postgres:
    # Расширения postgis, pg_trgm и pgcrypto обязательны — обычный
    # postgres:16 не подойдёт.
    image: postgis/postgis:16-3.4
    container_name: rg-pg
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: restaurant_guide_test
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      # -h 127.0.0.1: при первом старте образ поднимает временный сервер
      # только на сокете, создаёт базу и перезапускается. Проверка через
      # сокет сочла бы базу готовой до перезапуска.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres"]
      interval: 3s
      timeout: 5s
      retries: 40

  redis:
    image: redis:7-alpine
    container_name: rg-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  pg_data:
