name: E2E

# Сквозные сценарии мобильного приложения на Maestro (пилот 01.11.2026, PR #165).
# Android-эмулятор, сервер стенда, PostgreSQL и Redis поднимаются в самом
# задании. Шаги — те же, что локально, и тем же скриптом mobile/.maestro/e2e.sh,
# а не копией его команд: стенд один, локальному и облачному прогонам
# разъехаться нечему. Ловушки стенда и сценариев — в шапках e2e.sh и
# mobile/.maestro/config.yaml.
#
# Куда ходит приложение. Только в сервер стенда этого задания: сборка
# ENV=development смотрит на 10.0.2.2:3000 — так эмулятор видит localhost
# раннера. Прода здесь нет, секретов тоже: ключи Firebase и MapKit заменены
# заглушками (push и содержимое карты сценарии не проверяют), пароль тестового
# пользователя — случайный на каждый прогон.
#
# Вне гейта. В обязательные проверки main не добавлен и без слова Координатора
# не добавляется: эмулятор в CI бывает нестабилен. Запуск — на PR, меняющих
# mobile/**, и вручную (Actions → E2E → Run workflow). На push в main не висит
# намеренно: Railway с «Wait for CI» не выкатывает коммит, у которого упал
# любой workflow, — флак эмулятора сорвал бы выкатку сервера. По той же
# причине вручную на main — только когда гейт CI свежего коммита закончился.

on:
  pull_request:
    paths:
      - 'mobile/**'
      - 'mobile/.maestro/**'
      - '.github/workflows/e2e.yml'
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Maestro CLI закреплён: версия и сумма архива с GitHub-релиза — те же, что
  # у локальной установки пилота.
  MAESTRO_VERSION: '2.12.0'
  MAESTRO_SHA256: a6044a84542f522f434c5dc3d609e60c7446d423f3ed1b2ae513f5c48663ec5e
  # Не отправлять разработчику Maestro статистику запусков.
  MAESTRO_CLI_NO_ANALYTICS: '1'

jobs:
  maestro:
    name: Mobile — сценарии Maestro на эмуляторе
    runs-on: ubuntu-latest
    timeout-minutes: 45

    services:
      postgres:
        # Как в ci.yml: расширения postgis/pg_trgm/pgcrypto обязательны. Базу
        # стенда maestro_e2e создаёт e2e.sh db из template_postgis этого образа.
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Зависимости сервера
        working-directory: backend
        run: npm ci

      - name: База стенда — схема по рецепту ci.yml и stand/seed.sql
        env:
          # e2e.sh ходит в базу через docker exec — здесь это контейнер сервиса.
          E2E_PG_CONTAINER: ${{ job.services.postgres.id }}
        run: bash mobile/.maestro/e2e.sh db

      - name: Сервер стенда (в фоне до конца задания)
        env:
          E2E_PG_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          mkdir -p "$RUNNER_TEMP/e2e"
          nohup bash mobile/.maestro/e2e.sh server > "$RUNNER_TEMP/e2e/server.log" 2>&1 &
          for _ in $(seq 60); do
            if [ "$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 http://127.0.0.1:3000/api/v1/health)" = 200 ]; then
              echo "Сервер стенда отвечает."
              exit 0
            fi
            sleep 2
          done
          echo "Сервер стенда не поднялся за 2 минуты. Его журнал:"
          cat "$RUNNER_TEMP/e2e/server.log"
          exit 1

      - name: Тестовый пользователь (пароль случайный)
        run: |
          bash mobile/.maestro/e2e.sh user
          # В журнале задания пароль — звёздочками: Maestro печатает вводимый текст.
          # В артефакте (commands.json журналов Maestro) он виден как есть — это
          # не утечка: пароль одноразовый, база стенда исчезает вместе с заданием.
          . mobile/.maestro/.env.local
          echo "::add-mask::$E2E_PASSWORD"

      - uses: actions/setup-java@v6
        with:
          # Java 21 — как у локальной сборки (JBR из Android Studio). Библиотека
          # карт Яндекса (maps.mobile 4.22) собрана под Java 21, и javac 17 её
          # классы не читает: «class file has wrong version 65.0, should be
          # 61.0» (первый прогон 01.11.2026). Maestro на Java 21 тоже работает.
          distribution: temurin
          java-version: '21'
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          # Как в ci.yml: закреплено под локальную версию разработки.
          flutter-version: '3.35.2'
          channel: stable
          cache: true

      - name: Заглушки вместо ключей Firebase и MapKit (только здесь)
        # google-services.json и ключ MapKit в git не лежат (.gitignore), а без
        # них Gradle не соберёт приложение. Заглушки живут только на этом
        # одноразовом раннере: Firebase поднимается, но токена push не получит
        # (приложение это переживает — main.dart и push_notification_service),
        # карта останется без тайлов. Ключ Firebase — формата настоящего
        # (A и 38 знаков): иначе Firebase падает на проверке формата в фоновом
        # потоке, а не сетевой ошибкой.
        run: |
          cat > mobile/android/app/google-services.json <<'JSON'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "nirivio-e2e-stub",
              "storage_bucket": "nirivio-e2e-stub.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000",
                  "android_client_info": { "package_name": "com.nirivio.app" }
                },
                "oauth_client": [],
                "api_key": [{ "current_key": "Ae2eStubNotARealFirebaseApiKey000000000" }],
                "services": { "appinvite_service": { "other_platform_oauth_client": [] } }
              }
            ],
            "configuration_version": "1"
          }
          JSON
          echo 'YANDEX_MAPKIT_API_KEY=00000000-0000-0000-0000-000000000000' >> mobile/android/local.properties

      - name: Тестовая сборка (ENV=development, x86_64)
        run: bash mobile/.maestro/e2e.sh apk

      - name: Остановить Gradle — память эмулятору
        run: |
          (cd mobile/android && ./gradlew --stop) || true
          pkill -f KotlinCompileDaemon || true
          df -h /

      - name: Maestro CLI (сумма архива сверяется)
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/maestro.zip" \
            "https://github.com/mobile-dev-inc/Maestro/releases/download/cli-$MAESTRO_VERSION/maestro.zip"
          echo "$MAESTRO_SHA256  $RUNNER_TEMP/maestro.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/maestro.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/maestro/bin" >> "$GITHUB_PATH"

      - name: KVM для эмулятора
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Эмулятор и сценарии
        uses: reactivecircus/android-emulator-runner@v2
        env:
          E2E_REPORT_DIR: ${{ runner.temp }}/e2e
          # Драйвер Maestro на эмуляторе CI стартует дольше, чем ждёт умолчание.
          MAESTRO_DRIVER_STARTUP_TIMEOUT: '120000'
        with:
          # Экран как у локального Pixel_6: те же места кнопок и клавиатуры.
          # Образ default — без сервисов Google. С ними (google_apis) свежий
          # эмулятор в первые минуты обновляет их модули, сервисы
          # перезапускаются, и 01.11.2026 такой перезапуск уронил приложение:
          # geolocator_android 4.6.2 не переживал обрыв связи с ними
          # (исправлено в 5.0.2; с PR #170 у нас 5.0.4, прогон на google_apis
          # 41325866542 пережил такой перезапуск). Push, вход через Google и
          # геолокацию сценарии не проверяют, клавиатура в обоих образах одна
          # (AOSP).
          api-level: 34
          target: default
          arch: x86_64
          profile: pixel_6
          cores: 3
          ram-size: 4096M
          disable-spellchecker: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none
          # Каждая строка — отдельная команда sh -c, поэтому здесь только
          # вызовы скрипта.
          script: |
            bash mobile/.maestro/e2e.sh install
            bash mobile/.maestro/e2e.sh test

      - name: Итог сценариев — в сводку прогона
        if: always()
        run: |
          python3 - "$RUNNER_TEMP/e2e/report.xml" >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import os, sys
          import xml.etree.ElementTree as ET
          sys.stdout.reconfigure(encoding="utf-8")
          path = sys.argv[1]
          print("### Сценарии Maestro\n")
          if not os.path.exists(path):
              print("Отчёта JUnit нет: прогон не дошёл до сценариев — см. журнал задания.")
              sys.exit(0)
          cases = list(ET.parse(path).getroot().iter("testcase"))
          failed = [c for c in cases if c.find("failure") is not None or c.find("error") is not None]
          print(f"Прошли {len(cases) - len(failed)} из {len(cases)}.\n")
          for c in cases:
              mark = "❌" if c in failed else "✅"
              print(f"- {mark} {c.get('name')} — {c.get('time', '?')} с")
          PY

      - name: Отчёт и журналы — артефактом
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-maestro
          path: ${{ runner.temp }}/e2e
          retention-days: 14
          if-no-files-found: ignore
