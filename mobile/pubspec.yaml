name: restaurant_guide_mobile
version: 1.0.0+1
description: Мобильное приложение Restaurant Guide Belarus v2.0
publish_to: "none"

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.13.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  provider: ^6.0.5
  dio: ^5.4.3
  yandex_mapkit: ^4.0.0
  geolocator: ^10.1.0
  cached_network_image: ^3.3.1
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0
  google_sign_in: ^6.2.1
  flutter_web_auth_2: ^4.0.1
  intl: ^0.20.2
  image_picker: ^1.0.7
  http: ^1.2.0
  flutter_svg: ^2.0.10
  url_launcher: ^6.2.5
  share_plus: ^10.1.4
  fl_chart: ^0.69.2
  firebase_core: ^3.13.0
  firebase_messaging: ^15.2.3
  file_picker: ^8.1.7
  pdfx: ^2.7.0
  path_provider: ^2.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  flutter_launcher_icons: ^0.14.4

# App launcher icon — NIRIVIO «cockade» (source assets in mobile/icon/, exported
# from the Claude Design handoff). Regenerate with:
#   dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  image_path_android: "icon/android-legacy-ic_launcher-512.png"
  adaptive_icon_background: "icon/android-adaptive-background-1024.png"
  adaptive_icon_foreground: "icon/android-adaptive-foreground-1024.png"
  # Foreground asset is already fitted to the 66dp safe-zone (×0.79) by the
  # design export, so suppress the generator's default 16% inset (would
  # double-shrink the mark).
  adaptive_icon_foreground_inset: 0
  image_path_ios: "icon/ios-appicon-1024.png"
  remove_alpha_ios: true

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/

  # Шрифты канона Nirivio вшиты в сборку и объявлены СЕМЕЙСТВАМИ (SDL CAT-C-1.3,
  # Amendment 2026-09-22). Семейство держит все свои начертания, и файл под
  # запрошенный вес выбирает Flutter — поэтому `fontWeight` в любом месте кода
  # доходит до своего .ttf. До 23.09.2026 шрифты шли через пакет google_fonts,
  # а он регистрировал каждое начертание ОТДЕЛЬНЫМ семейством
  # (`NunitoSans_regular`, `NunitoSans_600`): вес поверх такого семейства файла
  # не переключал, движок дорисовывал синтетическое утолщение.
  #
  # Вшиты, а не тянутся из сети: без интернета текст иначе рисовался бы
  # системным шрифтом, а он шире — ломает подбор кегля в AdaptiveTitle и вёрстку
  # карточек. Все четыре семейства под лицензией OFL — вшивание разрешено.
  #
  # Каталог google_fonts/ и имена Family-Variant.ttf остались от пакета; теперь
  # это только соглашение — файл выбирается объявлением ниже, а не именем.
  # Строка `- google_fonts/` в assets не нужна: объявленный шрифт попадает в
  # сборку под тем же ключом (`google_fonts/…`). У JosefinSans-ExtraLight.ttf
  # собственный вес 250 — объявлен как 200, ближайшая сотня вниз.
  #
  # Новое начертание = положить .ttf И вписать его сюда; состав канона
  # меняется решением владельца. Сторож соответствия —
  # test/config/fonts_bundled_test.dart.
  fonts:
    - family: Unbounded
      fonts:
        - asset: google_fonts/Unbounded-Regular.ttf
          weight: 400
    - family: NunitoSans
      fonts:
        - asset: google_fonts/NunitoSans-Regular.ttf
          weight: 400
        - asset: google_fonts/NunitoSans-Medium.ttf
          weight: 500
        - asset: google_fonts/NunitoSans-SemiBold.ttf
          weight: 600
        - asset: google_fonts/NunitoSans-Bold.ttf
          weight: 700
    - family: Onest
      fonts:
        - asset: google_fonts/Onest-SemiBold.ttf
          weight: 600
    - family: JosefinSans
      fonts:
        - asset: google_fonts/JosefinSans-ExtraLight.ttf
          weight: 200
        - asset: google_fonts/JosefinSans-Light.ttf
          weight: 300
        - asset: google_fonts/JosefinSans-SemiBold.ttf
          weight: 600
