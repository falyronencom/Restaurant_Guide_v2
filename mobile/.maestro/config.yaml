# Сквозные сценарии Maestro для мобильного приложения (Android, пилот 01.11.2026).
#
# Как запускать (Windows, Git Bash, из корня репозитория). Подробно — в шапке
# mobile/.maestro/e2e.sh:
#   mobile/.maestro/e2e.sh emulator   # 1. эмулятор
#   mobile/.maestro/e2e.sh db         # 2. база стенда maestro_e2e
#   mobile/.maestro/e2e.sh server     # 3. сервер стенда — в отдельном окне
#   mobile/.maestro/e2e.sh user       # 4. тестовый пользователь
#   mobile/.maestro/e2e.sh build      # 5. тестовая сборка на эмулятор
#   mobile/.maestro/e2e.sh test       # 6. все сценарии
#
# Запускать через e2e.sh, а не голым `maestro test`. Скрипт проверяет, что на
# :3000 отвечает стенд, а не что-то другое; выключает на эмуляторе геолокацию
# и рукописный ввод стилусом — оба дают системные окна поверх приложения;
# передаёт почту и пароль тестового пользователя. Обычная сборка приложения
# ходит в ПРОД — на ней сценарии не запускать.
#
# Сценарии — файлы *.yaml в этой папке. Каждый начинается с чистого запуска
# (данные приложения стёрты) и от соседей не зависит. subflows/ — общие
# начала (гость, вход), сами по себе не запускаются: в список flows ниже
# подпапки не входят.
#
# Правила для новых сценариев:
#  - селектор — видимый текст. Где текста нет или он меняется — метка
#    Semantics(identifier: 'e2e-<экран>-<элемент>') в коде и селектор id:.
#    Key из Flutter Maestro не видит. Сейчас меток четыре: строка и кнопка
#    поиска на главной, сердечко на карточке, «моё местоположение» на карте;
#  - Flutter сливает соседние надписи в одну: подпись вкладки — «Карта»,
#    перевод строки и «Вкладка 3 из 5», строка выдачи — «Maestro Bistro»,
#    перевод строки и «Ресторан». Нужна регулярка «Карта.*», точный текст не
#    совпадёт. Посмотреть, что видит Maestro:
#    C:\maestro\bin\maestro.bat --device emulator-5554 hierarchy
#  - в name сценария не ставить двоеточие: из имени Maestro делает папку
#    отчёта, а в путях Windows двоеточие запрещено (сценарий падает сразу);
#  - что сценарий меняет на сервере (избранное), то он же и возвращает:
#    следующий прогон должен начинать с того же состояния.
flows:
  - "*"
