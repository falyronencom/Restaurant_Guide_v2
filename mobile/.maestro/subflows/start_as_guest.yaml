# Общее начало: приложение «как после установки», вход пропущен — гость
# на главной. Сценарием сам по себе не запускается (подпапка не входит в
# список flows в config.yaml), его зовут через runFlow.
appId: com.nirivio.app
---
# clearState стирает данные приложения: ни сессии, ни сохранённого города.
# Разрешения Maestro при запуске выдаёт сам; геолокация устройства на стенде
# выключена (e2e.sh test), поэтому системных окон про место нет.
- launchApp:
    clearState: true
# Заставка держится не меньше 2,8 с, а отладочная сборка на эмуляторе
# стартует медленнее телефона — ждём экран входа с запасом.
- extendedWaitUntil:
    visible: "Регистрация"
    timeout: 60000
- tapOn: "Пропустить"
# Логотип и слоган на главной — одна надпись «NIRIVIO» + перевод строки +
# «Вкусное рядом», поэтому регулярка, а не точный текст.
- extendedWaitUntil:
    visible: "NIRIVIO.*"
    timeout: 20000
