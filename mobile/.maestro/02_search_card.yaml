# Поиск → список результатов → карточка заведения (гость).
# Данные — заведения стенда из stand/seed.sql: шесть мест в Минске, слово
# «Maestro» — только у «Maestro Bistro» и «Maestro Coffee». Набираем латиницей:
# ввод кириллицы через adb ненадёжен.
#
# Путь — через экран выдачи, а не через превью на главной: превью даёт ссылку
# «Показать все», только если мест больше трёх, а здесь их два. Превью на
# главной проходит сценарий 04 (избранное).
appId: com.nirivio.app
name: "Поиск — список результатов и карточка заведения"
tags:
  - smoke
---
- runFlow: subflows/start_as_guest.yaml
# Кнопка поиска при пустой строке — стрелка: открывает весь список города.
# Кнопку Maestro находит по метке: у неё только иконка.
- tapOn:
    id: "e2e-home-search-button"
# Экран выдачи: строка поиска с подсказкой «С чего начнем?», все места стенда.
- extendedWaitUntil:
    visible: "С чего начнем?"
    timeout: 20000
- extendedWaitUntil:
    visible: "Результаты: 6"
    timeout: 20000
- tapOn: "С чего начнем?"
- inputText: "Maestro"
# Клавиша поиска на клавиатуре отправляет запрос (onSubmitted).
- pressKey: Enter
# Ровно два места. Покажи поиск всё подряд — осталось бы 6.
- extendedWaitUntil:
    visible: "Результаты: 2"
    timeout: 20000
# Карточка списка — одна надпись: «Maestro Coffee», перевод строки,
# «Кофейня» и остальное, поэтому регулярка.
- assertVisible: "Maestro Coffee.*"
- tapOn: "Maestro Bistro.*"
# Карточка заведения: название, адрес и сердечко избранного.
- extendedWaitUntil:
    visible: "пр. Независимости, 1"
    timeout: 20000
- assertVisible: "Maestro Bistro"
- assertVisible:
    id: "e2e-detail-favorite"
