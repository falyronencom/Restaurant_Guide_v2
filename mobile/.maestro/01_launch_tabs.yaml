# Запуск после чистой установки: заставка проходит, гость попадает на главную,
# все пять вкладок открываются.
appId: com.nirivio.app
name: "Запуск после чистой установки — заставка и все вкладки"
tags:
  - smoke
---
- runFlow: subflows/start_as_guest.yaml
# Главная гостя: город по умолчанию и строка поиска.
- assertVisible: "Минск"
- assertVisible:
    id: "e2e-home-search-field"
# Подпись вкладки Maestro видит вместе со служебной частью Flutter: «Карта»,
# перевод строки и «Вкладка 3 из 5» (пробелы в ней неразрывные). Точный текст
# «Карта» с ней не совпадёт — нужна регулярка «Карта.*». Каждая вкладка
# проверяется своей надписью: выделенная кнопка ещё не значит, что экран
# собрался.
- tapOn: "Новости.*"
- assertVisible: "Новости и акции"
- tapOn: "Карта.*"
# Саму карту и пины Maestro не видит (нативный слой Яндекса) — проверяется
# Flutter-кнопка «моё местоположение» поверх неё.
- assertVisible:
    id: "e2e-map-my-location"
- tapOn: "Избранное.*"
- assertVisible: "Войдите, чтобы сохранять любимые заведения"
- tapOn: "Профиль.*"
# Карточка гостя в профиле — одна надпись в несколько строк.
- assertVisible: ".*Гость.*"
- tapOn: "Поиск.*"
- assertVisible: "NIRIVIO.*"
