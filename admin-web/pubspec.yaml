name: restaurant_guide_admin_web
version: 1.0.0+1
description: Веб-админка Restaurant Guide Belarus v2.0 (Flutter Web)
publish_to: "none"

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.13.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  provider: ^6.0.5
  dio: ^5.4.3
  go_router: ^14.2.0
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0
  intl: ^0.20.2
  fl_chart: ^0.69.2
  url_launcher: ^6.2.5
  flutter_svg: ^2.0.10
  # Для web: используйте web-specific пакеты, если требуется
  # Например, для карт можно использовать flutter_map или другие web-совместимые решения

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  # Отслеживание течей на весь сьют (`test/flutter_test_config.dart`). Пакет
  # приходит и транзитивно с `flutter_test`, но мы импортируем его сами —
  # значит объявляем явно, иначе `flutter analyze` ругается, а гейт падает.
  # Версия — `any`, как у самого Flutter для этого пакета: `flutter_test`
  # пиннит его ТОЧНО (3.0.10), и каретка сломала бы `pub get` на SDK, где
  # пакет уедет в следующую мажорную.
  leak_tracker_flutter_testing: any

flutter:
  uses-material-design: true

  assets:
    # Брендовый набор иконок (категории, кухни, атрибуты). Источник —
    # docs/design_handoff_web_vitrine/assets/icons. Перекрашиваются через
    # ColorFilter, поэтому контур должен быть одноцветным.
    - assets/icons/

  # Шрифты канона Nirivio объявлены СЕМЕЙСТВАМИ, а не отданы google_fonts.
  # Разница в том, кто подбирает файл под вес: здесь семейство держит все свои
  # начертания, и Flutter выбирает нужный файл сам — поэтому `fontWeight` в
  # любом месте кода доходит до своего .ttf. google_fonts регистрировал каждое
  # начертание ОТДЕЛЬНЫМ семейством (`NunitoSans_regular`, `NunitoSans_600`), и
  # вес поверх такого семейства ничего не переключал: движок рисовал
  # синтетическое утолщение, а вшитый файл лежал мёртвым грузом.
  #
  # Файлы лежат в google_fonts/ (имена — по схеме Family-Variant.ttf, источник
  # mobile/google_fonts/). Отдельной строкой в assets: они НЕ объявлены —
  # объявления здесь достаточно, а дубль клал бы тот же мегабайт в сборку
  # дважды. Новое начертание = положить .ttf И вписать его сюда; состав канона
  # меняется решением владельца (SDL CAT-C-1.3).
  # Сторож соответствия — test/config/fonts_bundled_test.dart.
  fonts:
    - family: Unbounded
      fonts:
        - asset: google_fonts/Unbounded-Regular.ttf
          weight: 400
    - family: NunitoSans
      fonts:
        - asset: google_fonts/NunitoSans-Regular.ttf
          weight: 400
        - asset: google_fonts/NunitoSans-Medium.ttf
          weight: 500
        - asset: google_fonts/NunitoSans-SemiBold.ttf
          weight: 600
        - asset: google_fonts/NunitoSans-Bold.ttf
          weight: 700
    - family: Onest
      fonts:
        - asset: google_fonts/Onest-SemiBold.ttf
          weight: 600
    - family: JosefinSans
      fonts:
        - asset: google_fonts/JosefinSans-SemiBold.ttf
          weight: 600
    - family: JetBrainsMono
      fonts:
        - asset: google_fonts/JetBrainsMono-Regular.ttf
          weight: 400
        - asset: google_fonts/JetBrainsMono-Medium.ttf
          weight: 500
