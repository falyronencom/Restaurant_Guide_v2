name: restaurant_guide_admin_web
version: 1.0.0+1
description: Веб-админка Restaurant Guide Belarus v2.0 (Flutter Web)
publish_to: "none"

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.13.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  provider: ^6.0.5
  dio: ^5.4.3
  go_router: ^14.2.0
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0
  intl: ^0.20.2
  fl_chart: ^0.69.2
  url_launcher: ^6.2.5
  google_fonts: ^6.1.0
  # Для web: используйте web-specific пакеты, если требуется
  # Например, для карт можно использовать flutter_map или другие web-совместимые решения

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true

  assets:
    # Шрифты канона Nirivio вшиты в сборку, а не тянутся из сети:
    # GoogleFonts.config.allowRuntimeFetching = false в main.dart.
    # Имена файлов обязаны следовать схеме google_fonts: Family-Variant.ttf.
    # Источник — mobile/google_fonts/. Новое начертание = добавить сюда .ttf.
    - google_fonts/
