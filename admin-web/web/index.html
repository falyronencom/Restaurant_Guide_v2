<!DOCTYPE html>
<html lang="ru">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Админ-панель Nirivio — модерация заведений, аналитика, журнал действий.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="NIRIVIO · Админ-панель">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>NIRIVIO · Админ-панель</title>
  <link rel="manifest" href="manifest.json">

  <!--
    Заглушка до старта приложения (проход по панели модератора, 20.10,
    пункт A3-27): пока скачивается движок, страница была белой. Тот же кадр,
    что рисует приложение на старте, — вордмарк по центру на сером фоне;
    снимается первым кадром Flutter.
  -->
  <style>
    html, body { margin: 0; height: 100%; background: #F5F5F5; }
    #boot-placeholder {
      position: fixed; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 12px;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    #boot-placeholder .wordmark {
      color: #DB4F13; font-size: 30px; font-weight: 600; letter-spacing: 0.5px;
    }
    #boot-placeholder .caption { color: #757575; font-size: 13px; }
  </style>
</head>
<body>
  <div id="boot-placeholder" aria-live="polite">
    <div class="wordmark">NIRIVIO</div>
    <div class="caption">Загружаем панель…</div>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var placeholder = document.getElementById('boot-placeholder');
      if (placeholder) placeholder.remove();
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
